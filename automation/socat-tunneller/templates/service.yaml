apiVersion: v1
kind: Service
metadata:
  name: {{ include "tunneller.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "tunneller.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "tunneller.chart" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- range $tunnel := .Values.tunnels }}
    - port: {{ include "tunneller.localPort" $tunnel }}
      targetPort: tunnel-port-{{ include "tunneller.localPort" $tunnel }}
      protocol: TCP
      name: tunnel-port-{{ include "tunneller.localPort" $tunnel }}
    {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "tunneller.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
